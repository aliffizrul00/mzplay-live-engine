<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZPlay Cloud Live Predictor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px 10px; background: #030712; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background: #0b0f19; padding: 20px; border-radius: 22px; border: 1px solid #1f2937; box-shadow: 0 20px 40px rgba(0,0,0,0.85); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #070a13; padding: 10px 14px; border-radius: 12px; font-size: 0.8rem; border: 1px solid #1e293b; margin-bottom: 16px; }
        .engine-title { color: #06b6d4; font-weight: 800; font-family: monospace; }
        .status-dot { height: 10px; width: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block; margin-right: 4px; box-shadow: 0 0 8px #22c55e; }
        .slot-box { display: flex; justify-content: space-between; gap: 5px; background: #030712; padding: 8px; border-radius: 14px; margin-bottom: 16px; border: 1px solid #111827; }
        .slot { flex: 1; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111827; border-radius: 8px; border: 1px solid #1f2937; }
        .slot.BIG { background: rgba(236, 72, 153, 0.18); border-color: #ec4899; }
        .slot.BIG .num { color: #fbcfe8; }
        .slot.SMALL { background: rgba(6, 182, 212, 0.18); border-color: #06b6d4; }
        .slot.SMALL .num { color: #cffaff; }
        .card { background: #030712; border: 2px solid #1f2937; border-radius: 18px; padding: 20px; text-align: center; }
        .pred-val { font-size: 46px; font-weight: 900; margin: 4px 0; letter-spacing: 3px; }
        .BIG { color: #ec4899; text-shadow: 0 0 22px rgba(236, 72, 153, 0.7); }
        .SMALL { color: #06b6d4; text-shadow: 0 0 22px rgba(6, 182, 212, 0.7); }
        .WAIT { color: #374151; font-size: 14px; padding: 14px 0; font-weight: 700; }
        .signal-wrapper { margin-top: 12px; border-top: 1px dashed #1f2937; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; }
        .signal-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 900; letter-spacing: 1px; }
        .signal-badge.ALLIN { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }
        .signal-badge.LAWAN { background: rgba(250, 204, 21, 0.2); color: #facc15; border-color: #facc15; }
        .signal-badge.FOLLOW { background: rgba(34, 197, 94, 0.2); color: #22c55e; border-color: #22c55e; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <span class="engine-title">⚡ RENDER LIVE CLOUD</span>
        <span><span class="status-dot"></span> <span id="statusText">CONNECTED</span></span>
    </div>
    <div class="slot-box" id="slotBox"></div>
    <div class="card">
        <div style="font-size: 0.75rem; color: #9ca3af; font-weight: 900;">NEXT PREDICTION</div>
        <div id="predText" class="pred-val WAIT">CONNECTING TO LIVE...</div>
        <div class="signal-wrapper">
            <span style="font-size: 0.75rem; font-weight: 800; color: #9ca3af;">ISYARAT:</span>
            <span id="signalBadge" class="signal-badge">TIADA DATA</span>
        </div>
    </div>
</div>
<script>
async function fetchLiveData() {
    try {
        const res = await fetch('/api/live-data');
        const json = await res.json();
        if (json.success && json.data.length > 0) {
            renderSlots(json.data);
            if (json.data.length >= 10) runMatrixEngine(json.data);
        }
    } catch (e) {
        document.getElementById('statusText').innerText = "DISCONNECTED";
    }
}
function renderSlots(data) {
    const box = document.getElementById('slotBox');
    box.innerHTML = '';
    const displayData = [...data].reverse().slice(0, 10);
    displayData.forEach(item => {
        box.innerHTML += `<div class="slot ${item.type}"><span class="num">${item.number}</span><span style="font-size: 0.75rem; font-weight: 900;">${item.type==='BIG'?'B':'S'}</span></div>`;
    });
}
function runMatrixEngine(data) {
    const types = data.map(d => d.type);
    let prediction = "", signal = "FOLLOW";
    let streakCount = 1;
    for (let i = 0; i < types.length - 1; i++) {
        if (types[i] === types[i+1]) streakCount++; else break;
    }
    if (streakCount >= 5) { prediction = types[0] === 'BIG' ? 'SMALL' : 'BIG'; signal = 'ALLIN'; }
    else if (streakCount >= 3) { prediction = types[0]; signal = 'FOLLOW'; }
    else { prediction = types[0] === 'BIG' ? 'SMALL' : 'BIG'; signal = 'LAWAN'; }
    const predEl = document.getElementById('predText');
    predEl.innerText = prediction; predEl.className = "pred-val " + prediction;
    const badge = document.getElementById('signalBadge');
    badge.className = "signal-badge " + signal;
    badge.innerText = signal === 'ALLIN' ? '🔥 ALL IN' : (signal === 'LAWAN' ? '🔄 LAWAN' : '➡️ FOLLOW');
}
setInterval(fetchLiveData, 4000);
fetchLiveData();
</script>
</body>
</html>
